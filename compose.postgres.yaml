services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: patternpilot
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: patternpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - patternpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patternpilot -d patternpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  patternpilot-postgres:
