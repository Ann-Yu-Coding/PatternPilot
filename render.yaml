# Render Blueprint (see docs/deploy.md). Singapore is Render's closest region to Seoul and Tokyo.
services:
  - type: web
    name: patternpilot
    runtime: docker
    region: singapore
    plan: starter
    # Exactly one instance: practice sessions live in server memory (product.md §3, item 7).
    numInstances: 1
    healthCheckPath: /api/healthz
    # Runs before each release starts; both commands are safe to repeat.
    preDeployCommand: sh scripts/predeploy.sh
    # Deploy only on request, so a push never restarts the server during a learner session.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: patternpilot-db
          property: connectionString
      - key: ADMIN_SECRET
        generateValue: true

databases:
  - name: patternpilot-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
    # No outside connections; only Render services in this account can reach it.
    ipAllowList: []
